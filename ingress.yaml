apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-host-ingress
  namespace: apps
spec:
  ingressClassName: nginx
  rules:
  - host: app.local
    http:
      paths:
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: service3
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service1
            port:
              number: 80
  - host: api.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service2
            port:
              number: 80